plp_profile_1_init_ports_lane_num:0x2=2,2
plp_profile_1_init_speed_mode:0x2=100000,100000

# 0:CR_PORT_RETIMER, 1:CR_PORT_BITMUX, 2:CR_PORT_GEARBOX
plp_profile_1_speed_100000_split_2.0:connection_mode=2
# 0:    CR_PMODE_SERDES,  //!< basic Lane only mode
# 1:    CR_PMODE_PCS,     //!< serdes + pcs used (no macsec)
# 2:    CR_PMODE_MACSEC   //!< macsec all blocks used
plp_profile_1_speed_100000_split_2.0:port_mode=0
# 不知道干啥的
plp_profile_1_speed_100000_split_2.0:flags=0
# 0:CR_FEC_NONE, 1:CR_FEC_FIRE_CODE, 2:CR_FEC_RS_528, 3:CR_FEC_RS_544
