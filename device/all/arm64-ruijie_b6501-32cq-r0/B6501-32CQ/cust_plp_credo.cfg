# 待看哪里取
plp_fw_ver=0x3fe5b1
# 待看哪里取
plp_fw_crc=0x9aa7
# slot数量，线卡数量
plp_slot_num=1

# 0:mac 1:cpu 2:fpga
plp_mdio_accs_type:0=0
plp_mdio_accs_type:1=0
plp_mdio_accs_type:2=0
plp_mdio_accs_type:3=0

# phy的mdio地址列表？每片slice都要
