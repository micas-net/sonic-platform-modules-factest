# port 9 10
# phy 1 slice 0
plp_phy_unit_id:0x2=0
# 线卡id 白盒没有
plp_phy_card_id:0x2=0
# mdio_id 0或者1
plp_phy_mdio_id:0x2=0

# 这是实际是 c45标识+devtype，c45应该去掉，只留devtype。 creso phy 固定为1。
plp_phy_reg_offset:0x2=0

plp_phy_init_profile_id:0x2=1

# 拆分？怎么和mac侧端口号关联
